name: Daily apartment scan
on:
  workflow_dispatch:
  schedule:
    # DST-safe fallback: select the correct UTC slot by Bucharest's offset.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
permissions:
  contents: read
concurrency:
  group: apartment-scraper
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select local 08:00 slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset = datetime.now(ZoneInfo('Europe/Bucharest')).utcoffset().total_seconds() / 3600
          expected = '0 5 * * *' if offset == 3 else '0 6 * * *'
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or os.environ['SCHEDULE'] == expected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(run).lower() + '\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pip install --require-hashes -r requirements.lock
      - name: Scan and email
        if: steps.slot.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: PYTHONPATH=src python -m apartment_scraper.main
